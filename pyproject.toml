[project]
name = "foco-agendas"
version = "0.1.0"
description = "Static, JS-free mirror of Forsyth County, GA public meeting agendas"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32",
    "beautifulsoup4>=4.12",
    # Windows has no system zoneinfo database, and slim Linux images often
    # lack one too. America/New_York is load-bearing here, so pin it in.
    "tzdata>=2024.1",
    # Most county boards publish agendas only as PDFs; without this they would
    # appear in the index as a date and a link with no searchable content.
    "pypdf>=5.0",
]

[project.optional-dependencies]
discover = ["playwright>=1.44"]

[dependency-groups]
dev = ["pytest>=8.0"]

[project.scripts]
foco = "foco.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/foco"]

[tool.pytest.ini_options]
testpaths = ["tests"]
